<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>众和包装后台管理</title>

<style>
body{
    margin:0;
    background:#f5f7fa;
    font-family:"Microsoft YaHei",Arial;
}

.container{
    width:420px;
    margin:120px auto;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-bottom:30px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#1677ff;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#0958d9;
}

#msg{
    margin-top:15px;
    text-align:center;
}
</style>

</head>


<body>

<div class="container">

<h1>众和包装后台</h1>

<input id="username" placeholder="用户名">

<input id="password" type="password" placeholder="密码">

<button onclick="login()">登录</button>

<div id="msg"></div>

</div>


<script src="supabase.js"></script>


<script>

async function login(){

let username=document.getElementById("username").value;

let password=document.getElementById("password").value;


const {data,error}=await supabase
.from("users")
.select("*")
.eq("username",username)
.eq("password",password)
.single();


if(error){

document.getElementById("msg").innerHTML=
"账号或密码错误";

return;

}


if(data.role==="admin"){

document.getElementById("msg").innerHTML=
"登录成功";

localStorage.setItem(
"user",
JSON.stringify(data)
);


setTimeout(()=>{

window.location.href="dashboard.html";

},800);


}


}

</script>


</body>
</html>
