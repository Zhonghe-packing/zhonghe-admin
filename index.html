<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2a54">
  <meta name="description" content="上海众和包装机械有限公司内部销售管理系统">
  <title>众和销售助手</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b2a54'/%3E%3Cpath d='M14 19h17L18 44h17' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M38 19v25M38 32h13M51 19v25' fill='none' stroke='%233ea6ff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./assets/css/app.css?v=20260914-2">
</head>
<body>
  <div id="app-loading" class="app-loading" aria-live="polite">
    <div class="brand-mark brand-mark--pulse" aria-hidden="true">ZH</div>
    <span>正在启动…</span>
  </div>

  <main id="login-view" class="login-view is-hidden">
    <section class="login-brand" aria-label="品牌介绍">
      <div class="login-brand__content">
        <div class="login-logo"><span>ZH</span></div>
        <p class="eyebrow">ZHONGHE PACKING MACHINERY</p>
        <h1>众和销售助手</h1>
        <p class="login-tagline">让销售更高效，让管理更简单</p>
        <div class="login-feature">
          <span class="login-feature__line"></span>
          <p>客户、订单与项目资料统一归档，重要信息随时可查。</p>
        </div>
      </div>
    </section>

    <section class="login-panel">
      <form id="login-form" class="login-card" novalidate>
        <div class="login-card__mobile-brand">
          <div class="brand-mark">ZH</div>
          <div><strong>众和销售助手</strong><span>ZHONGHE SALES</span></div>
        </div>
        <div class="login-heading">
          <p class="eyebrow">内部工作平台</p>
          <h2>欢迎登录</h2>
          <p>使用公司分配的账号进入系统</p>
        </div>

        <label class="field">
          <span>账号</span>
          <div class="input-shell">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg>
            <input id="username" name="username" type="text" autocomplete="username" inputmode="text" placeholder="请输入账号，如 LB" required>
          </div>
        </label>

        <label class="field">
          <span>密码</span>
          <div class="input-shell">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
            <button id="toggle-password" class="icon-button" type="button" aria-label="显示密码">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>
        </label>

        <p id="login-error" class="form-message form-message--error is-hidden" role="alert"></p>
        <button id="login-button" class="primary-button primary-button--large" type="submit">
          <span>登录</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <p class="login-help">仅限公司内部员工使用</p>
      </form>
    </section>
  </main>

  <div id="app-view" class="app-shell is-hidden">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <div class="brand-mark">ZH</div>
        <div><strong>众和销售助手</strong><span>ZHONGHE SALES</span></div>
      </div>
      <nav class="sidebar__nav" aria-label="主导航">
        <a href="#/dashboard" data-route="dashboard"><span class="nav-icon">⌂</span><span>首页</span></a>
        <a href="#/customers" data-route="customers"><span class="nav-icon">◎</span><span>客户管理</span></a>
        <a href="#/orders" data-route="orders"><span class="nav-icon">▣</span><span>订单管理</span></a>
        <a href="#/files" data-route="files"><span class="nav-icon">◇</span><span>资料归档</span></a>
        <a href="#/statistics" data-route="statistics"><span class="nav-icon">↗</span><span>数据统计</span></a>
        <a href="#/profile" data-route="profile"><span class="nav-icon">○</span><span>个人中心</span></a>
      </nav>
      <div class="sidebar__footer">
        <div class="sidebar-user">
          <div id="sidebar-avatar" class="avatar">ZH</div>
          <div><strong id="sidebar-name">—</strong><span id="sidebar-role">—</span></div>
        </div>
        <button class="sidebar-logout" data-action="logout" type="button" aria-label="退出登录">↪</button>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <p id="topbar-date" class="topbar-date"></p>
          <h1 id="topbar-title">首页</h1>
        </div>
        <div class="topbar-actions">
          <span class="secure-chip"><i></i>安全连接</span>
          <button class="mobile-avatar avatar" data-action="profile" type="button" aria-label="个人中心">ZH</button>
        </div>
      </header>
      <div id="page-content" class="page-content" aria-live="polite"></div>
    </section>

    <nav class="mobile-nav" aria-label="手机导航">
      <a href="#/dashboard" data-route="dashboard"><span>⌂</span><small>首页</small></a>
      <a href="#/customers" data-route="customers"><span>◎</span><small>客户</small></a>
      <a href="#/orders" data-route="orders"><span>▣</span><small>订单</small></a>
      <a href="#/files" data-route="files"><span>◇</span><small>文件</small></a>
      <a href="#/profile" data-route="profile"><span>○</span><small>我的</small></a>
    </nav>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="./assets/js/config.js"></script>
  <script type="module" src="./assets/js/auth.js?v=20260914-2"></script>
</body>
</html>
