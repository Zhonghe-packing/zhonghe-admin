<section class="page-toolbar">
  <div class="search-box"><span>⌕</span><input id="file-search" type="search" placeholder="搜索文件名、客户、订单或类型"></div>
  <div class="toolbar-actions"><button id="file-upload" class="primary-button" type="button">↑ 上传资料</button></div>
</section>
<section class="panel data-panel">
  <div class="data-panel__heading"><div><h2>资料归档</h2><p id="file-summary">正在读取文件数据…</p></div><span class="storage-note">支持 PDF、图片、Excel、Word，单个不超过 20MB</span></div>
  <div id="file-list" class="responsive-list"><div class="page-loader"><span class="spinner spinner--blue"></span></div></div>
  <div id="file-pagination" class="pagination"></div>
</section>
<div id="file-modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="file-modal-title">
  <div class="modal-card modal-card--narrow">
    <header><div><p class="eyebrow">资料归档</p><h2 id="file-modal-title">上传文件</h2></div><button type="button" data-close-modal="file-modal" aria-label="关闭">×</button></header>
    <form id="file-form" class="form-grid">
      <label class="upload-drop field--wide" for="archive-file"><span>↑</span><strong>选择要上传的文件</strong><small id="selected-file-name">PDF、图片、Excel 或 Word</small><input id="archive-file" type="file" required accept=".pdf,.png,.jpg,.jpeg,.webp,.xls,.xlsx,.doc,.docx"></label>
      <label class="field"><span>客户</span><select id="file-customer"><option value="">不关联客户</option></select></label>
      <label class="field"><span>订单</span><select id="file-order"><option value="">不关联订单</option></select></label>
      <section id="file-customer-enrichment" class="customer-enrichment field--wide is-hidden">
        <div class="subsection-heading"><div><strong>顺手补充客户资料</strong><small id="file-customer-enrichment-note">以下资料不完整，可填写后与文件一起保存；暂时不知道可以跳过</small></div><span>选填</span></div>
        <div class="nested-form-grid">
          <label class="field"><span>联系人</span><input id="file-customer-contact" maxlength="60" placeholder="暂时不知道可不填"></label>
          <label class="field"><span>电话</span><input id="file-customer-phone" maxlength="40" inputmode="tel" placeholder="暂时不知道可不填"></label>
          <label class="field"><span>邮箱</span><input id="file-customer-email" type="email" maxlength="120" placeholder="暂时不知道可不填"></label>
          <label class="field"><span>国家/地区</span><input id="file-customer-country" maxlength="60" placeholder="暂时不知道可不填"></label>
          <label class="field field--wide"><span>地址</span><input id="file-customer-address" maxlength="240" placeholder="暂时不知道可不填"></label>
        </div>
      </section>
      <label class="field"><span>文件类型</span><select id="file-type"><option>合同</option><option>报价单</option><option>图片</option><option>技术资料</option><option>其他</option></select></label>
      <label id="file-owner-field" class="field is-hidden"><span>负责人 *</span><select id="file-owner"></select></label>
      <label class="field field--wide"><span>备注</span><textarea id="file-remark" rows="3" maxlength="500" placeholder="文件内容说明"></textarea></label>
      <footer><button type="button" class="secondary-button" data-close-modal="file-modal">取消</button><button id="file-save" class="primary-button" type="submit">上传并归档</button></footer>
    </form>
  </div>
</div>
