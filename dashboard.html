<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>众和包装后台管理</title>


<style>

body{

margin:0;

background:#f5f7fa;

font-family:"Microsoft YaHei",Arial;

}


.header{

height:70px;

background:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 40px;

box-shadow:0 2px 10px rgba(0,0,0,.05);

}


.logo{

font-size:24px;

font-weight:bold;

}


.logout{

background:#ff4d4f;

color:white;

border:none;

padding:10px 25px;

border-radius:6px;

cursor:pointer;

}



.container{

max-width:1200px;

margin:50px auto;

}



.welcome{

background:white;

padding:30px;

border-radius:12px;

margin-bottom:30px;

}



.cards{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:25px;

}



.card{

background:white;

padding:35px;

border-radius:12px;

text-align:center;

box-shadow:0 5px 20px rgba(0,0,0,.05);

}



.card h2{

margin-bottom:20px;

}



.card button{

background:#1677ff;

color:white;

border:0;

padding:12px 30px;

border-radius:6px;

cursor:pointer;

}



</style>


</head>


<body>



<div class="header">

<div class="logo">
众和包装后台
</div>


<button class="logout" onclick="logout()">
退出登录
</button>


</div>




<div class="container">


<div class="welcome">

<h2>欢迎管理员</h2>

<p id="userInfo">
正在读取...
</p>

</div>




<div class="cards">


<div class="card">

<h2>品牌图库</h2>

<p>
管理企业图片、设备图片
</p>

<button>
进入管理
</button>

</div>



<div class="card">

<h2>首页内容</h2>

<p>
修改首页文字和介绍
</p>

<button>
进入管理
</button>

</div>



<div class="card">

<h2>Banner管理</h2>

<p>
PC三段式和手机主图
</p>

<button>
进入管理
</button>

</div>


</div>


</div>



<script>


let user =
localStorage.getItem("user");


if(!user){

window.location.href="index.html";

}


else{


let data=JSON.parse(user);


document.getElementById("userInfo").innerHTML=

"当前账号："+data.username+
"　角色："+data.role;


}



function logout(){

localStorage.removeItem("user");

window.location.href="index.html";


}


</script>



</body>

</html>
