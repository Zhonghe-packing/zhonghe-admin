<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>众和销售助手</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    background:#f5f7fa;

    font-family:"Microsoft YaHei",Arial,sans-serif;

}



.header{

    height:70px;

    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 50px;

    box-shadow:0 2px 10px rgba(0,0,0,.06);

}



.logo{

    font-size:24px;

    font-weight:bold;

    color:#222;

}



.logout{

    background:#ff4d4f;

    border:none;

    color:white;

    padding:10px 25px;

    border-radius:6px;

    cursor:pointer;

}



.container{

    max-width:1200px;

    margin:50px auto;

}



.welcome{

    background:white;

    padding:30px;

    border-radius:12px;

    margin-bottom:35px;

}



.welcome h1{

    margin:0 0 15px;

}



.cards{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:30px;

}



.card{

    background:white;

    padding:40px;

    border-radius:15px;

    box-shadow:0 5px 20px rgba(0,0,0,.05);

}



.card h2{

    margin-top:0;

    font-size:24px;

}



.card p{

    color:#666;

    height:40px;

}



.card button{

    margin-top:20px;

    padding:12px 35px;

    border:0;

    background:#1677ff;

    color:white;

    border-radius:6px;

    cursor:pointer;

    font-size:15px;

}



.card button:hover{

    background:#0958d9;

}



.icon{

    font-size:40px;

}


</style>


</head>



<body>



<div class="header">


<div class="logo">

众和销售助手

</div>


<button class="logout" onclick="logout()">

退出登录

</button>


</div>




<div class="container">



<div class="welcome">

<h1>
欢迎使用销售助手
</h1>

<p id="userinfo">
正在读取管理员信息...
</p>

</div>




<div class="cards">



<div class="card">

<div class="icon">📋</div>

<h2>
订单管理
</h2>

<p>
创建订单、查看订单状态、维护订单信息
</p>

<button>
进入订单管理
</button>

</div>




<div class="card">

<div class="icon">📁</div>

<h2>
资料归档
</h2>

<p>
合同、报价单、技术文件、图片资料统一保存
</p>

<button>
进入资料库
</button>

</div>




<div class="card">

<div class="icon">👥</div>

<h2>
客户管理
</h2>

<p>
保存客户信息和历史合作记录
</p>

<button>
查看客户
</button>

</div>




<div class="card">

<div class="icon">🔍</div>

<h2>
搜索中心
</h2>

<p>
快速查询客户、订单和文件资料
</p>

<button>
开始搜索
</button>

</div>



</div>



</div>




<script>


let user = localStorage.getItem("user");



if(!user){

    window.location.href="index.html";

}


else{


    let data = JSON.parse(user);


    document.getElementById("userinfo").innerHTML =

    "当前账号：" + data.username +

    "　权限：" + data.role;


}



function logout(){

    localStorage.removeItem("user");

    window.location.href="index.html";

}



</script>



</body>

</html>
