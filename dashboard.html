<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>众和包装销售助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
<aside class="sidebar">
<h2>众和包装</h2>
<p>销售助手</p>
<div class="menu active" onclick="showPage('orders')">📋 订单管理</div>
<div class="menu" onclick="showPage('customers')">👥 客户管理</div>
<div class="menu" onclick="showPage('files')">📁 资料归档</div>
<div class="menu" onclick="showPage('stats')">📊 数据统计</div>
<button onclick="logout()">退出登录</button>
</aside>

<main class="main">
<h1>销售助手工作台</h1>

<div class="cards">
<div class="card">订单数量<h2 id="orderCount">0</h2></div>
<div class="card">客户数量<h2 id="customerCount">0</h2></div>
<div class="card">资料文件<h2 id="fileCount">0</h2></div>
</div>

<div class="panel" id="content">
<h2>订单资料归档</h2>
<p>选择左侧功能开始管理。</p>
</div>
</main>
</div>

<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
